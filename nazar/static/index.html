<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RampReady</title><link rel="stylesheet" href="/design.css"></head><body><div id="app" aria-live="polite"><p style="padding:48px">Loading the planning desk…</p></div><div id="message" role="status" hidden></div><dialog id="review-dialog"><form id="review-form"><h2 class="w" id="review-title"></h2><p id="review-action"></p><label for="review-note">Review note</label><textarea id="review-note" required minlength="5" maxlength="600" rows="4"></textarea><div id="approval-checks"><label><input type="checkbox" name="assumptions"> I checked the assumptions.</label><label><input type="checkbox" name="availability"> I checked resource availability, or confirmed this action makes no booking.</label><label><input type="checkbox" name="cost"> I checked costs, or confirmed no spending is proposed.</label></div><p class="muted">This records a planning review. It does not move an aircraft, book space or spend money.</p><div class="tool-row"><button type="button" id="cancel-review">Cancel</button><button type="submit" id="save-review">Save review</button></div><p id="review-error" role="alert"></p></form></dialog><input type="file" id="booking-file" accept=".csv,text/csv" hidden><script src="/design-tools.js" defer></script><script src="/design.js" defer></script></body></html>
